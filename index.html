<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Reserva una reunión</title>

<meta name="theme-color" content="#1a1a1a">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#1a1a1a;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:1200px;
}

/* Loader */

.loader{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
    letter-spacing:1px;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid rgba(255,255,255,.2);
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-right:15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#calendly{
    display:none;
    width:100%;
    min-width:320px;
    border:none;
}

/* Escritorio */

@media(min-width:1025px){

    #calendly{
        height:930px;
    }

}

/* Tablet */

@media(max-width:1024px){

    #calendly{
        height:1080px;
    }

}

/* Móvil */

@media(max-width:768px){

    #calendly{
        height:1220px;
    }

}

</style>

</head>

<body>

<div class="container">

<div id="loader" class="loader">

<div class="spinner"></div>

<div>Cargando calendario...</div>

</div>

<div
id="calendly"
class="calendly-inline-widget"
data-url="https://calendly.com/dokgohyuk1997?hide_gdpr_banner=1&hide_landing_page_details=1&background_color=1a1a1a&text_color=ffffff">
</div>

</div>

<script src="https://assets.calendly.com/assets/external/widget.js"></script>

<script>

window.addEventListener("load",()=>{

    setTimeout(()=>{

        document.getElementById("loader").style.display="none";
        document.getElementById("calendly").style.display="block";

    },1200);

});

/* Si Calendly informa la altura, se aplica automáticamente */

window.addEventListener("message",function(e){

    if(
        e.data &&
        e.data.event &&
        e.data.event.indexOf("calendly")===0 &&
        e.data.payload &&
        e.data.payload.height
    ){

        document.getElementById("calendly").style.height=
        e.data.payload.height+"px";

    }

});

</script>

</body>
</html>
